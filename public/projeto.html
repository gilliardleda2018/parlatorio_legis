<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Projeto — LEGIS</title>
<meta name="description" content="Texto, situação e histórico de um projeto da Câmara, com links para as leis citadas.">
<link rel="icon" type="image/png" href="/marca/legis-32.png">
<link rel="stylesheet" href="/aggilli.css">
<style>
  main { max-width: 900px; margin: 0 auto; padding: 24px 16px 48px; display: flex; flex-direction: column; gap: 16px }
  .texto { white-space: pre-wrap; line-height: 1.6; max-width: 75ch }
  .hist li { margin: 4px 0 }
  .cits { font-size: 13px } .cits code { font-size: 12px; word-break: break-all }
</style>
</head>
<body>
<nav class="nav"><div class="menu">
  <a class="marca" href="/"><img id="logoNav" src="/marca/legis-icone.png" alt=""><span><span id="casaNav">Câmara Municipal</span><small>Projeto</small></span></a>
  <span class="esp"></span>
  <a class="item" href="/transparencia#projetos">Projetos</a><a class="item" href="/participe">Participe</a><a class="item" href="/normas">Normas</a><a class="item" href="/dados">Dados abertos</a>
</div></nav>
<main id="conteudo"><p class="vazio">Carregando…</p></main>
<script src="/rodape.js"></script>
<script src="/acompanhar.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const urlSegura = u => { const t = String(u ?? '').trim(); return /^(https?:\/\/|\/(?![\/\\]))/i.test(t) ? t : ''; };
const data = ms => new Date(ms).toLocaleDateString('pt-BR');
const SIT = { em_tramitacao: 'Em tramitação', em_pauta: 'Em pauta', aprovada: 'Aprovado', rejeitada: 'Rejeitado', retirada: 'Retirado',
  adiada: 'Adiado', sem_quorum: 'Sem quórum', pendente: 'Pendente', em_discussao: 'Em discussão', em_votacao: 'Em votação', proposta: 'Proposta' };
const EV = { pauta: 'Pauta', votacao: 'Votação', proposta: 'Proposta registrada', destaque: 'Destaque na sessão virtual' };

async function carregar() {
  const id = location.pathname.split('/').pop();
  const r = await fetch('/api/projeto-publico/' + encodeURIComponent(id));
  if (!r.ok) { $('conteudo').innerHTML = '<p class="vazio">Projeto não encontrado.</p>'; return; }
  const D = await r.json(), p = D.projeto;
  $('casaNav').textContent = D.casa.nome;
  document.title = `${p.numero} — ${D.casa.nome}`;
  /* ementaHtml e textoHtml vêm do servidor já escapados; só as citações reconhecidas viram <a>/<span> */
  $('conteudo').innerHTML = `
    <section class="cartao"><h2>${esc(p.numero)}<span class="esp"></span><span class="chip ${p.situacao === 'aprovada' ? 'sim' : p.situacao === 'rejeitada' ? 'nao' : ''}">${esc(SIT[p.situacao] || p.situacao)}</span></h2>
      <p style="margin-top:0;font-size:17px">${D.ementaHtml}</p>
      <p class="detalhe">Autoria: ${esc(p.autor || '—')} · apresentado em ${data(p.criado)}
        · <a href="/dados/akn/projeto/${esc(p.id)}.xml">texto em Akoma Ntoso</a>
        ${p.anexo ? ` · <a href="/anexo/${esc(p.id)}.pdf?v=${esc(p.anexo.v)}" target="_blank" rel="noopener">📄 ${esc(p.anexo.nome)}</a>` : ''}
        ${urlSegura(p.saplUrl) ? ` · <a href="${esc(urlSegura(p.saplUrl))}" target="_blank" rel="noopener noreferrer">tramitação no SAPL</a>` : ''}</p>
      <div data-acompanhar data-feed="${esc(D.feed)}" data-agenda="${esc(D.agenda)}" data-projeto="${esc(p.id)}" data-titulo="${esc(p.numero)}"></div>
    </section>
    <section class="cartao neutro"><h2>Histórico</h2>
      ${(p.historico || []).length ? `<ul class="hist">${p.historico.map(h => `<li>${data(h.ts)} · ${esc(h.sessao)} · ${esc(EV[h.evento] || h.evento)}${h.resultado || h.situacao ? ': ' + esc(SIT[h.resultado || h.situacao] || h.resultado || h.situacao) : ''}${h.contagem ? ` (${h.contagem.sim} sim, ${h.contagem.nao} não)` : ''}</li>`).join('')}</ul>` : '<p class="vazio">Ainda sem movimentação registrada.</p>'}
    </section>
    <section class="cartao neutro"><h2>Texto</h2>
      ${D.textoHtml ? `<div class="texto">${D.textoHtml}</div>` : urlSegura(p.textoUrl) ? `<p><a href="${esc(urlSegura(p.textoUrl))}" target="_blank" rel="noopener noreferrer">Texto original</a></p>` : '<p class="vazio">Texto integral não cadastrado.</p>'}
    </section>
    ${D.citacoes.length ? `<section class="cartao neutro cits"><h2>Normas citadas</h2>
      <p class="detalhe" style="margin-top:0">Reconhecidas automaticamente. As federais abrem no <a href="https://www.lexml.gov.br" target="_blank" rel="noopener noreferrer">LexML Brasil</a>; as municipais cadastradas abrem na <a href="/normas">lista de normas</a>. Confira sempre o texto oficial.</p>
      <ul>${[...new Map(D.citacoes.map(c => [c.urn || c.texto, c])).values()].map(c => `<li>${c.href ? `<a href="${esc(urlSegura(c.href))}" ${c.href.startsWith('https://') ? 'target="_blank" rel="noopener noreferrer"' : ''}>${esc(c.texto)}</a>` : esc(c.texto)}
        ${c.urn ? `<br><code>${esc(c.urn)}</code>` : '<br><small class="suave">sem identificador LexML (informe UF e município da Câmara ou cadastre a norma)</small>'}</li>`).join('')}</ul></section>` : ''}`;
  document.querySelectorAll('[data-acompanhar]').forEach(el => Acompanhar.montar(el));
  const t = await fetch('/api/transparencia').then(x => x.json()).catch(() => null);
  if (t) Rodape.mostrar(t.rodape, t.casa);
}
carregar();
</script>
</body>
</html>
