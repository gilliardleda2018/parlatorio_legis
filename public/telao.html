<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Telão — Parlatório Legis</title>
<link rel="icon" type="image/png" href="/marca/favicon-32x32.png">
<link rel="stylesheet" href="/aggilli.css">
<style>
  html, body { height: 100%; overflow: hidden }
  body { display: flex; flex-direction: column; background: radial-gradient(ellipse at top, color-mix(in srgb, var(--cartao3) 70%, var(--fundo)), var(--fundo) 70%) }
  .topo { display: flex; align-items: center; gap: 2vh; padding: 1.6vh 3vw; background: var(--destaque-suave); backdrop-filter: blur(8px); color: #fff; box-shadow: 0 2px 12px rgba(0,0,0,.25) }
  .topo img { width: 6.5vh; height: 6.5vh; background: #fff; border-radius: 1.2vh; padding: .5vh; object-fit: contain }
  .topo .casa { font-size: 3vh; font-weight: 700; line-height: 1.1 }
  .topo .sessao { font-size: 2vh; opacity: .9 }
  .topo .esp { flex: 1 }
  .topo .pres { font-size: 2.4vh; font-weight: 600; text-align: right; line-height: 1.2 }
  .topo .pres b { font-size: 3.4vh }
  .topo .hora { font-size: 4.6vh; font-weight: 800; margin-left: 2vw }
  .faixa { display: flex; justify-content: center; align-items: center; gap: 2vw; padding: 2vh 3vw 0; text-align: center }
  .faixa .fase { font-size: 4vh; font-weight: 800; letter-spacing: .08em; text-transform: uppercase }
  .materia { margin: 1vh auto 0; max-width: 62vw; text-align: center; font-size: 2.4vh; color: var(--suave); border-left: .5vh solid var(--ciano); padding: .6vh 1.5vh; background: color-mix(in srgb, var(--cartao) 60%, transparent); border-radius: .8vh }
  .materia b { color: var(--texto) }
  .palco { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.4vh; padding: 0 4vw; min-height: 0 }
  .palco .av { width: 20vh; height: 20vh; font-size: 7vh; box-shadow: 0 0 0 .6vh var(--cor-partido), 0 1vh 4vh rgba(0,0,0,.4) }
  .palco .nome { font-size: 7.4vh; font-weight: 800; text-align: center; line-height: 1.05; text-wrap: balance }
  .palco .sigla { font-size: 2.8vh; padding: .5vh 2vh }
  .palco .tempo { font-size: 25vh; font-weight: 800; line-height: .95 }
  .palco .barra { width: 62vw; height: 2.2vh }
  .palco .chip { font-size: 2.2vh; padding: .9vh 2.2vh }
  .palco .chip .ponto { width: 1.6vh; height: 1.6vh }
  .ocioso img { width: 26vh; height: 26vh; object-fit: contain; filter: drop-shadow(0 1vh 3vh rgba(0,0,0,.4)) }
  .ocioso .casa { font-size: 6vh; font-weight: 800; text-align: center }
  .ocioso .sub { font-size: 3vh; color: var(--suave) }
  .cartao-interr { position: fixed; right: 3vw; top: 30vh; background: var(--cartao); border-top: .6vh solid var(--azul); border-radius: 2vh; padding: 2vh 3vh; min-width: 28vw; box-shadow: 0 1vh 4vh rgba(0,0,0,.4); display: flex; gap: 2vh; align-items: center }
  .cartao-interr .av { width: 10vh; height: 10vh; font-size: 4vh }
  .cartao-interr .rot { font-size: 2.2vh; color: var(--azul); font-weight: 800; letter-spacing: .1em; text-transform: uppercase }
  .cartao-interr .nm { font-size: 3.4vh; font-weight: 700 }
  .cartao-interr .t { font-size: 7vh; font-weight: 800; line-height: 1 }
  .proximos { padding: 1.8vh 3vw; display: flex; gap: 2.4vw; align-items: center; font-size: 2.4vh; min-height: 9vh; background: color-mix(in srgb, var(--cartao) 80%, transparent); border-top: .4vh solid var(--destaque-suave) }
  .proximos .rot { color: var(--suave); font-weight: 800; text-transform: uppercase; letter-spacing: .08em; white-space: nowrap }
  .proximos .it { display: flex; align-items: center; gap: 1vh; white-space: nowrap }
  .proximos .av { width: 5vh; height: 5vh; font-size: 2vh }

  /* votação */
  .vot { flex: 1; display: grid; grid-template-columns: 30vw 1fr; gap: 3vw; padding: 2vh 3vw; min-height: 0 }
  .vot .lado { display: flex; flex-direction: column; gap: 2vh; justify-content: center }
  .vot .tit { font-size: 2.4vh; color: var(--suave); font-weight: 800; letter-spacing: .1em; text-transform: uppercase }
  .vot .mat { font-size: 4.4vh; font-weight: 800 }
  .vot .ementa { font-size: 2.4vh; color: var(--suave) }
  .vot .placar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.4vh }
  .vot .placar div { background: var(--cartao); border-radius: 1.6vh; padding: 1.6vh; text-align: center; font-size: 2.2vh; font-weight: 600 }
  .vot .placar b { display: block; font-size: 8vh; line-height: 1 }
  .vot .placar .sim b { color: var(--sim) } .vot .placar .nao b { color: var(--nao) } .vot .placar .abst b { color: var(--abst) }
  .vot .res { font-size: min(7vh, 4.2vw); font-weight: 900; text-align: center; padding: 2vh; border-radius: 2vh; letter-spacing: .04em }
  .vot .res.aprovada { background: var(--sim); color: #fff } .vot .res.rejeitada { background: var(--nao); color: #fff } .vot .res.sem_quorum { background: var(--ambar); color: #1a1200 }
  .vot .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(max(17vw, 190px), 1fr)); gap: 1vh; align-content: center }
  .vot .p { display: flex; align-items: center; gap: 1.2vh; background: var(--cartao); border-radius: 1.2vh; padding: 1vh 1.4vh; font-size: 2.2vh; border-left: 1vh solid var(--cartao3) }
  .vot .p .av { width: 5.4vh; height: 5.4vh; font-size: 2vh }
  .vot .p .nm { flex: 1; min-width: 0; font-weight: 600; line-height: 1.15 }
  .vot .p .nm span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
  .vot .p .nm small { display: flex; gap: .8vh; align-items: center; margin-top: .3vh }
  .vot .p .sigla, .vot .p .v { flex: none }
  .vot .p .sigla { font-size: 1.5vh }
  .vot .p .v { font-weight: 800; font-size: 1.8vh; text-transform: uppercase }
  .vot .p.sim { border-left-color: var(--sim) } .vot .p.sim .v { color: var(--sim) }
  .vot .p.nao { border-left-color: var(--nao) } .vot .p.nao .v { color: var(--nao) }
  .vot .p.abst { border-left-color: var(--abst) } .vot .p.abst .v { color: var(--abst) }
  .vot .p.aus { opacity: .35 }
  #ativarSom { position: fixed; left: 2vw; bottom: 12vh; opacity: .8 }
  .rec { display: none; align-items: center; gap: 1vh; font-weight: 800; font-size: 2.2vh; letter-spacing: .08em; background: rgba(0,0,0,.25); padding: .6vh 1.4vh; border-radius: 99px }
  .rec.on { display: inline-flex }
  .rec::before { content: ''; width: 1.5vh; height: 1.5vh; border-radius: 50%; background: #ff4b4b; animation: pisca 1s steps(2, start) infinite }
  .congelado { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: color-mix(in srgb, #06101f 82%, transparent); backdrop-filter: blur(6px) }
  .congelado > div { text-align: center; padding: 5vh 6vw; border-radius: 3vh; background: var(--cartao); border-top: 1vh solid var(--azul); box-shadow: 0 2vh 6vh rgba(0,0,0,.5) }
  .congelado .ic { font-size: 14vh; line-height: 1 }
  .congelado .t1 { font-size: 8vh; font-weight: 900; letter-spacing: .04em; margin: 2vh 0 1vh }
  .congelado .t2 { font-size: 3.2vh; color: var(--suave) }
</style>
</head>
<body>
  <div class="topo">
    <img data-logo src="/marca/logo.svg" alt="">
    <div><div class="casa" data-casa></div><div class="sessao" data-sessao></div></div>
    <span class="esp"></span>
    <span class="rec" id="rec">REC</span>
    <div class="pres" id="presenca"></div>
    <span class="conexao"></span>
    <div class="hora tnum" id="hora"></div>
  </div>
  <div id="conteudo" style="flex:1;display:flex;flex-direction:column;min-height:0"></div>
  <div class="cartao-interr oculto" id="interr"></div>
  <div class="proximos" id="proximos"></div>
  <button class="botao pq fantasma" id="ativarSom">🔈 Ativar som</button>
  <div class="congelado oculto" id="congelado"></div>

<script src="/comum.js"></script>
<script>
const $ = id => document.getElementById(id);
const { esc, avatar, sigla, parl, fase } = PL;
$('ativarSom').onclick = () => { PL.bipe('alerta'); $('ativarSom').remove(); };
PL.aoSinal = tipo => { if (PL.estado.cfg.som) PL.bipe(tipo); };
addEventListener('dblclick', () => document.documentElement.requestFullscreen?.());

function chip(o) {
  const S = PL.estado;
  if (S.congelado) return `<span class="chip interr"><span class="ponto"></span>Sessão congelada</span>`;
  if (o.congelado) return `<span class="chip interr"><span class="ponto"></span>❄ Tempo congelado · microfone cortado</span>`;
  if (PL.mic(o.pid) === 'cortado') return `<span class="chip corte"><span class="ponto"></span>Microfone cortado</span>`;
  if (!o.inicio) return `<span class="chip"><span class="ponto"></span>Aguardando início</span>`;
  if (o.esgotou && !o.start) return `<span class="chip corte"><span class="ponto"></span>Tempo esgotado</span>`;
  if (S.interr) return `<span class="chip interr"><span class="ponto"></span>${PL.TIPOS[S.interr.tipo]}</span>`;
  if (o.start) return `<span class="chip vivo"><span class="ponto"></span>Com a palavra</span>`;
  return `<span class="chip"><span class="ponto"></span>Pausado</span>`;
}

function desenhar() {
  const S = PL.estado, o = S.orador, i = S.interr, v = S.votacao, q = PL.quorum();
  $('congelado').classList.toggle('oculto', !S.congelado);
  if (S.congelado) $('congelado').innerHTML = `<div><div class="ic">❄</div><div class="t1">SESSÃO CONGELADA</div>
    <div class="t2">${S.congelado.motivo ? esc(S.congelado.motivo) + '<br>' : ''}Microfones fechados · aguarde a presidência</div></div>`;
  $('presenca').innerHTML = `Presentes <b class="tnum">${q.presentes}/${q.n}</b><br>${q.ok ? 'Quórum atingido' : 'Sem quórum'}`;
  const m = S.pauta.find(x => x.id === S.materiaAtual);
  const faixaMateria = m ? `<div class="materia"><b>${esc(m.numero)}</b> — ${esc(m.ementa)}</div>` : '';

  if (v) {
    const c = v.contagem;
    const placar = v.tipo === 'simbolica' ? '<div class="ementa">Votação simbólica</div>'
      : c ? `<div class="placar"><div class="sim"><b class="tnum">${c.sim}</b>SIM</div><div class="nao"><b class="tnum">${c.nao}</b>NÃO</div><div class="abst"><b class="tnum">${c.abst}</b>ABST.</div></div>`
      : `<div class="placar"><div style="grid-column:1/-1"><b class="tnum">${v.votantes.length}</b>VOTOS REGISTRADOS</div></div>`;
    const grade = v.tipo === 'simbolica' ? '' : S.parls.map(p => {
      const voto = v.votos[p.id], votou = v.votantes.includes(p.id), aus = !S.presenca[p.id];
      const rotulo = voto ? PL.VOTOS[voto] : votou ? 'Votou' : aus ? 'Ausente' : v.aberta ? 'Aguardando' : 'Não votou';
      return `<div class="p ${voto || ''} ${aus && !votou ? 'aus' : ''}">${avatar(p)}<span class="nm"><span>${esc(p.nome)}</span><small>${sigla(p.partido)}<span class="v">${rotulo}</span></small></span></div>`;
    }).join('');
    $('conteudo').innerHTML = `<div class="vot">
      <div class="lado"><div class="tit">${v.aberta ? 'Votação em andamento' : 'Resultado da votação'} · ${esc(PL.QUORUNS[v.quorum])}</div>
        <div class="mat">${esc(v.numero)}</div><div class="ementa">${esc(v.ementa)}</div>${placar}
        ${v.resultado ? `<div class="res ${v.resultado}">${PL.SITUACOES[v.resultado].toUpperCase()}</div>` : ''}</div>
      <div class="grade">${grade}</div></div>`;
  } else if (o || i) {
    const quem = o ? parl(o.pid) : parl(i.pid);
    $('conteudo').innerHTML = `<div class="faixa"><span class="fase">${esc(o ? fase(o.fase).nome : PL.TIPOS[i.tipo])}</span></div>${faixaMateria}
      <div class="palco">${avatar(quem)}<div class="nome">${esc(quem.nome)}</div>${sigla(quem.partido)}${S.presencaModo?.[quem.id] === 'remoto' ? '<span class="chip interr" style="font-size:2vh;padding:.6vh 1.6vh"><span class="ponto"></span>🎥 Participação remota</span>' : ''}
        <div class="tempo tnum" id="tPrincipal"></div><div class="barra" id="bPrincipal"><i></i></div>${o ? chip(o) : ''}</div>`;
  } else {
    $('conteudo').innerHTML = `<div class="faixa"><span class="fase">${esc(fase(S.faseAtual).nome)}</span></div>${faixaMateria}
      <div class="palco ocioso"><img data-logo src="${S.casa.logoV ? '/imagem/logo?v=' + S.casa.logoV : '/marca/logo.svg'}" alt="">
      <div class="casa">${esc(S.casa.nome)}</div><div class="sub">${esc(S.casa.titulo)}</div></div>`;
  }

  const mostrarInterr = i && o && !v;
  $('interr').classList.toggle('oculto', !mostrarInterr);
  if (mostrarInterr) $('interr').innerHTML = `${avatar(parl(i.pid))}<div><div class="rot">${PL.TIPOS[i.tipo]}</div>
    <div class="nm">${esc(parl(i.pid).nome)}</div><div class="t tnum" id="tInterr"></div></div>`;

  const fid = o ? o.fase : S.faseAtual, nx = (S.filas[fid] || []).slice(0, 5);
  $('proximos').innerHTML = `<span class="rot">Próximos inscritos</span>` + (nx.length ? nx.map((e, k) => {
    const p = parl(e.pid); return `<span class="it"><span class="suave">${k + 1}.</span>${avatar(p)}${esc(p.nome)} ${sigla(p.partido)}</span>`;
  }).join('') : '<span class="suave">—</span>');
  relogios();
}
function relogios() {
  const S = PL.estado; if (!S) return;
  $('hora').textContent = PL.relogio();
  $('rec').classList.toggle('on', PL.gravando());
  if (S.votacao) return;
  if (S.orador) PL.pintar(S.orador, $('tPrincipal'), $('bPrincipal'));
  else if (S.interr) PL.pintar(S.interr, $('tPrincipal'), $('bPrincipal'));
  if (S.orador && S.interr) PL.pintar(S.interr, $('tInterr'));
}
PL.aoMudar(desenhar);
setInterval(relogios, 200);
PL.conectar();
</script>
</body>
</html>
