<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Parlamentar — LEGIS</title>
<link rel="icon" type="image/png" href="/marca/legis-32.png">
<link rel="apple-touch-icon" href="/marca/legis-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/aggilli.css">
<style>
  body { padding-bottom: env(safe-area-inset-bottom) }
  main { max-width: 520px; margin: 0 auto; padding: 14px; display: flex; flex-direction: column; gap: 14px }
  .eu { display: flex; align-items: center; gap: 12px }
  .eu .av { width: 56px; height: 56px; font-size: 20px }
  .eu .nm { flex: 1 }
  .eu .nm b { display: block; font-size: 19px }
  .acoes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
  .acoes .botao { min-height: 64px; white-space: normal; text-align: center; font-size: 16px }
  .acoes .largo { grid-column: 1 / -1 }
  .tribuna { display: flex; align-items: center; gap: 12px }
  .tribuna .nm { flex: 1; min-width: 0 }
  .tribuna .t { font-size: 34px; font-weight: 800 }
  .eu-fala { text-align: center }
  .eu-fala .t { font-size: 84px; font-weight: 800; line-height: 1; margin: 8px 0 }
  .votar { display: grid; gap: 10px }
  .votar .botao { min-height: 70px; font-size: 22px }
  .votar .sim { background: var(--sim); color: #fff } .votar .nao { background: var(--nao); color: #fff } .votar .abst { background: var(--abst); color: #fff }
  .votar .botao.escolhido { outline: 4px solid var(--texto); outline-offset: 2px }
  .pend { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-top: 1px solid var(--linha) }
  .login { display: flex; flex-direction: column; gap: 12px; text-align: center }
  .login img { width: 90px; margin: 10px auto 0 }
  .pin { font-size: 28px; letter-spacing: .4em; text-align: center }
  .status { font-size: 15px; display: flex; flex-direction: column; gap: 4px }
  .segmento { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; background: var(--cartao); padding: 4px; border-radius: 12px; position: sticky; top: 62px; z-index: 5 }
  .segmento button { border: 0; background: none; padding: 10px 4px; border-radius: 9px; font-weight: 600; font-size: 14px; cursor: pointer; color: var(--suave) }
  .segmento button.ativo { background: var(--destaque-suave); color: #fff }
  .coluna { display: flex; flex-direction: column; gap: 14px }
  .opcoes { display: flex; flex-wrap: wrap; gap: 6px }
  .opcoes button { border: 0; padding: 7px 11px; border-radius: 99px; background: var(--cartao2); font-size: 13px; cursor: pointer }
  .opcoes button.on { background: var(--destaque-suave); color: #fff }
  .ideia h3 { font-size: 17px; margin: 0 }
  .ideia .local { color: var(--suave); font-size: 13px; margin: 2px 0 10px }
  .ideia p { margin: 8px 0; font-size: 14px; line-height: 1.45 }
  .ideia .rotulo { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--suave); font-weight: 700; margin-top: 10px }
  .ideia ul { margin: 6px 0; padding-left: 18px; font-size: 13px }
  .ideia .fontes a { display: block; font-size: 13px; color: var(--azul); margin: 3px 0; overflow-wrap: anywhere }
  .afinidade { display: flex; align-items: center; gap: 10px; margin: 6px 0 }
  .afinidade .barra { flex: 1; height: 8px }
  .afinidade b { font-size: 20px; font-variant-numeric: tabular-nums }
  dialog { background: var(--cartao); color: var(--texto); border: 0; border-top: 4px solid var(--destaque-suave); border-radius: var(--raio); padding: 16px; width: min(500px, 94vw) }
  dialog::backdrop { background: rgba(0,0,0,.6) }
  /* modo acessível: letras maiores e contraste alto (preferência guardada no aparelho) */
  html.acessivel { font-size: 118% }
  html.acessivel body { --fundo: #000; --cartao: #0b0b0b; --cartao2: #1c1c1c; --texto: #fff; --suave: #e8e8e8; --linha: #8a8a8a; background: #000 }
  html.acessivel .botao { min-height: 52px; font-size: 1.05rem; border: 2px solid #fff }
  html.acessivel .chip { font-size: 13px; border: 1px solid currentColor }
  html.acessivel .cartao { border: 1px solid #8a8a8a }
  .pauta-item { border-left: 4px solid var(--linha) }
  .pauta-item.atual { border-left-color: var(--destaque); box-shadow: 0 0 0 2px var(--destaque-suave) }
  .so-leitor { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0) }
</style>
</head>
<body>
<nav class="nav"><div class="menu">
  <a class="marca" href="/"><img data-logo src="/marca/legis-icone.png" alt=""><span><span data-casa></span><small data-sessao></small></span></a>
  <span class="esp"></span><span class="conexao"></span><span class="relogio tnum" id="hora" style="font-size:16px"></span>
</div></nav>

<main id="login" class="oculto">
  <form class="cartao login" onsubmit="event.preventDefault(); entrar()">
    <div class="selo-legis" style="width:min(200px,65%);margin:0 auto 4px"><img class="legis-auto" src="/marca/legis-claro.webp" alt="LEGIS — Sistema de Gestão Parlamentar"></div>
    <img data-logo src="/marca/legis-icone.png" alt="">
    <h1 style="font-size:21px">Acesso do parlamentar</h1>
    <select class="campo" id="lParl" aria-label="Seu nome"></select>
    <input class="campo pin" id="lPin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN" aria-label="PIN">
    <button class="botao principal gr">Entrar</button>
  </form>
</main>

<main id="app" class="oculto">
  <div class="segmento" role="tablist">
    <button class="ativo" data-aba="plenario" role="tab">Plenário</button>
    <button data-aba="ideias" role="tab">Ideias de projetos</button>
    <button data-aba="virtual" role="tab">Virtual <span id="bolhaVirtual"></span></button>
    <button data-aba="minhas" role="tab">Minhas propostas</button>
    <button data-aba="pauta" role="tab">Pauta</button>
  </div>
  <div id="anuncio" class="so-leitor" aria-live="assertive"></div>
  <div id="videoCartao" class="cartao oculto" style="padding:10px">
    <div class="grupo" style="justify-content:space-between;align-items:center;margin-bottom:8px">
      <b>Sessão remota</b><span id="videoMic"></span><button class="botao pq fantasma" onclick="sairVideo()">Sair do vídeo</button></div>
    <div id="videoBox" style="height:320px;border-radius:10px;overflow:hidden;background:#000"></div>
  </div>
  <div id="conteudoApp" class="coluna"></div>
  <details class="cartao neutro" id="cartaoRegimento" style="margin-top:12px">
    <summary style="cursor:pointer;font-weight:700">📖 Pergunte ao Regimento</summary>
    <form class="grupo" style="margin-top:10px" onsubmit="event.preventDefault(); perguntarRegimento()">
      <input class="campo" id="rgPergunta" placeholder="Ex.: quanto tempo tenho no Grande Expediente?" style="flex:1;min-width:160px" maxlength="400">
      <button class="botao principal">Perguntar</button></form>
    <div id="rgResposta" class="detalhe" style="margin-top:8px"></div>
  </details>
</main>
<dialog id="dlgPropor"><form method="dialog" class="coluna" style="gap:12px" onsubmit="return false" id="formPropor"></form></dialog>

<script src="/comum.js"></script>
<script src="/passkey.js"></script>
<script>
const $ = id => document.getElementById(id);
const { esc, avatar, sigla, parl, fase } = PL;
const A = (nome, args) => PL.acao('parlamentar', nome, args).then(() => navigator.vibrate?.(30)).catch(() => {});
let eu = null;

async function iniciar() {
  PL.conectar();
  eu = await PL.quemSou('parlamentar');
  (eu ? $('app') : $('login')).classList.remove('oculto');
  if (eu && PL.estado) desenhar();  // o primeiro estado pode ter chegado antes de confirmar o login
  if (eu?.deveTrocar) PL.exigirTrocaPin('parlamentar');
}
async function entrar() {
  try { await PL.entrar('parlamentar', $('lPin').value, $('lParl').value); location.reload(); }
  catch (e) { PL.avisar(e.message, true); $('lPin').select(); }
}

PL.aoMudar(S => {
  if (!eu) {
    const sel = $('lParl'), atual = sel.value || localStorage.getItem('parlatorio.ultimo') || '';
    sel.innerHTML = '<option value="">Selecione seu nome…</option>' + [...S.parls].sort((a, b) => a.nome.localeCompare(b.nome)).map(p => `<option value="${p.id}">${esc(p.nome)} (${esc(p.partido)})</option>`).join('');
    sel.value = atual;
    sel.onchange = () => localStorage.setItem('parlatorio.ultimo', sel.value);
    return;
  }
  desenhar();
});

function desenhar() {
  const S = PL.estado, p = parl(eu.pid), o = S.orador, i = S.interr, v = S.votacao;
  const presente = !!S.presenca[eu.pid];
  const fila = S.filas[S.faseAtual] || [];
  const pos = fila.findIndex(e => e.pid === eu.pid);
  const meus = S.pedidos.filter(x => x.pid === eu.pid);
  const pediu = t => meus.some(x => x.tipo === t);
  const falando = o?.pid === eu.pid, apartando = i?.pid === eu.pid;
  const m = S.pauta.find(x => x.id === S.materiaAtual);
  const bloqueio = S.cfg.exigePresenca && !presente;

  let html = `<div class="cartao"><div class="eu">${avatar(p)}<div class="nm"><b>${esc(p.nome)}</b>${sigla(p.partido)}</div>
    <button class="botao pq fantasma" onclick="PL.exigirTrocaPin('parlamentar', true)" title="Trocar meu PIN">🔑 Trocar PIN</button>
    <button class="botao pq fantasma" onclick="alternarAcessivel()" aria-pressed="${document.documentElement.classList.contains('acessivel')}" title="Letras maiores e contraste alto">Aa</button>
    <button class="botao pq fantasma" onclick="PL.sair('parlamentar').then(()=>location.reload())">Sair</button></div>
    <div class="status" style="margin-top:12px">
      <div class="grupo">${PL.micChip(eu.pid)}${S.congelado ? '<span class="chip interr"><span class="ponto"></span>Sessão congelada</span>' : ''}</div>
      ${presente ? '<span class="chip sim">✓ Presença registrada</span>'
        : S.cfg.presencaCelular ? `<button class="botao ok gr" onclick="A('presenca')">Registrar presença</button>` : '<span class="chip ambar">Presença não registrada — procure a secretaria</span>'}
    </div></div>`;

  if (S.remoto?.ativo && !PL.temVideo()) {
    html += `<div class="cartao" style="border-top-color:var(--azul)"><h2>Sessão remota ativa</h2>
      <p class="detalhe" style="margin-top:0">Participe por vídeo: sua presença fica registrada como remota. O microfone abre quando a presidência conceder a palavra.</p>
      <button class="botao azul gr" style="width:100%" onclick="entrarVideo()">🎥 Entrar na sessão remota</button></div>`;
  }

  if (falando || apartando) {
    html += `<div class="cartao eu-fala"><h2 style="justify-content:center">${falando && o.congelado ? '❄ Seu tempo está congelado' : falando ? 'Você está com a palavra' : PL.TIPOS[i.tipo]}</h2>
      <div class="t tnum" id="tEu"></div><div class="barra" id="bEu"><i></i></div></div>`;
  }

  if (v && v.aberta && v.tipo !== 'simbolica') {
    const meuVoto = v.votos[eu.pid], jaVotou = v.votantes.includes(eu.pid);
    const travado = v.tipo === 'secreta' && jaVotou;
    html += `<div class="cartao" style="border-top-color:var(--ambar)"><h2>Votação ${v.tipo === 'secreta' ? 'secreta' : 'nominal'} aberta</h2>
      <p style="margin:0 0 12px"><b>${esc(v.numero)}</b> — ${esc(v.ementa)}</p>
      ${travado ? '<p class="chip sim" style="margin:0">✓ Voto registrado</p>'
        : `<div class="votar">${['sim', 'nao', 'abst'].map(x => `<button class="botao ${x} ${meuVoto === x ? 'escolhido' : ''}" ${bloqueio ? 'disabled' : ''}
            onclick="votar('${x}')">${PL.VOTOS[x]}</button>`).join('')}</div>
          ${meuVoto ? `<p class="detalhe">Seu voto: <b>${PL.VOTOS[meuVoto]}</b>. Você pode mudar enquanto a votação estiver aberta.</p>` : ''}
          ${v.tipo === 'secreta' ? '<p class="detalhe">Votação secreta: o voto não pode ser alterado depois de confirmado.</p>' : ''}`}
      ${v.tipo === 'nominal' ? PL.orientacoesHtml(v) : ''}
      ${v.tipo === 'nominal' && p.lider ? (() => { const b = PL.bancada(p), atual = (v.orientacoes || {})[b]?.o;
        return `<div style="margin-top:10px"><div class="detalhe">Como líder, oriente a bancada <b>${esc(b)}</b>:</div><div class="grupo" style="margin-top:6px">${Object.entries(PL.ORIENTACOES).map(([k, n]) =>
          `<button class="botao pq ${atual === k ? 'principal' : ''}" onclick="orientar('${k}')">${n}</button>`).join('')}${atual ? `<button class="botao pq fantasma" onclick="orientar('')">Retirar</button>` : ''}</div></div>`; })() : ''}
    </div>`;
  } else if (v && !v.aberta) {
    html += `<div class="cartao neutro"><h2>Resultado</h2><b>${esc(v.numero)}</b>: <span class="chip ${v.resultado === 'aprovada' ? 'sim' : v.resultado === 'rejeitada' ? 'nao' : 'ambar'}">${PL.SITUACOES[v.resultado]}</span></div>`;
  }

  html += `<div class="cartao neutro"><h2>Agora no plenário</h2>
    <div class="detalhe" style="margin-bottom:10px">${esc(fase(S.faseAtual).nome)}${m ? ` · <b>${esc(m.numero)}</b>` : ''}</div>
    ${o ? `<div class="tribuna">${avatar(parl(o.pid))}<div class="nm"><b>${esc(parl(o.pid).nome)}</b><br>${sigla(parl(o.pid).partido)}</div><span class="t tnum" id="tOrador"></span></div>`
      : '<p class="vazio" style="margin:0">Tribuna sem orador.</p>'}
    ${i && !apartando ? `<p class="detalhe">${PL.TIPOS[i.tipo]}: ${esc(parl(i.pid).nome)}</p>` : ''}</div>`;

  html += `<div class="cartao"><h2>Pedir a palavra</h2>
    ${pos >= 0 ? `<p style="margin:0 0 12px">Você é o <b>${pos + 1}º inscrito</b> em ${esc(fase(S.faseAtual).nome)}.</p>` : ''}
    <div class="acoes">
      ${pos >= 0 ? `<button class="botao largo fantasma" onclick="A('sairFila')">Cancelar minha inscrição</button>`
        : `<button class="botao principal largo" ${bloqueio || pediu('inscricao') || falando ? 'disabled' : ''} onclick="A('pedir',{tipo:'inscricao'})">${pediu('inscricao') ? 'Inscrição solicitada…' : 'Inscrever-me em ' + esc(fase(S.faseAtual).nome)}</button>`}
      <button class="botao" ${bloqueio || pediu('aparte') || !o?.start || falando ? 'disabled' : ''} onclick="A('pedir',{tipo:'aparte'})">${pediu('aparte') ? 'Aparte solicitado…' : 'Pedir aparte'}</button>
      <button class="botao" ${bloqueio || pediu('ordem') ? 'disabled' : ''} onclick="A('pedir',{tipo:'ordem'})">${pediu('ordem') ? 'Solicitada…' : 'Questão de ordem'}</button>
      <button class="botao largo" ${bloqueio || pediu('pelaordem') ? 'disabled' : ''} onclick="A('pedir',{tipo:'pelaordem'})">${pediu('pelaordem') ? 'Pela ordem solicitado…' : 'Pela ordem'}</button>
    </div>
    ${bloqueio ? '<p class="detalhe">Registre sua presença para pedir a palavra e votar.</p>' : ''}
    ${meus.length ? `<div style="margin-top:12px">${meus.map(x => `<div class="pend"><span>${PL.TIPOS[x.tipo]} <small class="suave">· aguardando o presidente</small></span>
      <button class="botao pq fantasma" onclick="A('cancelarPedido',{id:'${x.id}'})">Cancelar</button></div>`).join('')}</div>` : ''}
  </div>`;

  if (aba !== 'plenario') return;
  $('conteudoApp').innerHTML = html;
  relogios();
}
/* ---------------- sessão remota (vídeo) ---------------- */
async function entrarVideo() {
  try {
    await PL.acao('parlamentar', 'presencaRemota');
    $('videoCartao').classList.remove('oculto');
    await PL.video($('videoBox'), 'parlamentar');
    sincronizarMic();
    desenhar();
  } catch (e) { $('videoCartao').classList.add('oculto'); PL.avisar(e.message, true); }
}
function sairVideo() { PL.encerrarVideo(); $('videoCartao').classList.add('oculto'); desenhar(); }
function sincronizarMic() {
  if (!eu || !PL.temVideo()) return;
  const m = PL.mic(eu.pid), aberto = m === 'aberto' || m === 'tribuna';
  $('videoMic').innerHTML = PL.micChip(eu.pid);
  PL.sincronizarMicrofone(aberto);
}
PL.aoMudar(S => { sincronizarMic(); if (!S.remoto?.ativo && PL.temVideo()) sairVideo(); });

/* ---------------- plenário virtual (votação online com prazo) ---------------- */
const rascunhos = {};
const dtv = ms => new Date(ms).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
function desenharVirtualParl() {
  const S = PL.estado, lista = S.virtuais.filter(v => ['aberta', 'agendada', 'encerrada'].includes(v.status)).slice(0, 6);
  if (aba !== 'virtual') return;
  if (document.activeElement?.closest?.('#conteudoApp textarea')) return;  // não apaga o que está sendo digitado
  $('conteudoApp').innerHTML = lista.length ? lista.map(v => `<div class="cartao ${v.status === 'aberta' ? '' : 'neutro'}">
      <h2>${esc(v.titulo)}<span class="esp"></span><span class="chip ${v.status === 'aberta' ? 'sim' : ''}">${{ aberta: 'Votação aberta', agendada: 'Agendada', encerrada: 'Encerrada' }[v.status]}</span></h2>
      <p class="detalhe" style="margin-top:0">${v.status === 'aberta' ? `Vote até ${dtv(v.fim)}. Você pode mudar o voto até lá.` : v.status === 'agendada' ? `Abre em ${dtv(v.inicio)}.` : `Encerrada em ${dtv(v.encerrada)}.`}</p>
      ${v.itens.map(it => {
        const meu = it.votos[eu.pid]?.valor, c = { sim: 0, nao: 0, abst: 0 };
        Object.values(it.votos).forEach(x => c[x.valor]++);
        const destacado = it.destaques.length > 0;
        return `<div style="border-top:1px solid var(--linha);padding:12px 0">
          <b>${esc(it.numero)}</b> <small class="suave">${esc(it.autor || '')}</small>
          <p style="margin:4px 0 8px;font-size:14px">${esc(it.ementa)}</p>
          ${it.resultado ? `<span class="chip ${it.resultado === 'aprovada' ? 'sim' : it.resultado === 'rejeitada' ? 'nao' : 'ambar'}">${it.resultado === 'destacado' ? 'Destacado para a sessão presencial' : PL.SITUACOES[it.resultado]}</span>`
            : destacado ? `<span class="chip interr">Destacado por ${it.destaques.map(d => esc(parl(d).nome)).join(', ')} — vai à sessão presencial</span>`
            : v.status === 'aberta' ? `<div class="votar" style="grid-template-columns:1fr 1fr 1fr">${['sim', 'nao', 'abst'].map(x => `<button class="botao ${x} ${meu === x ? 'escolhido' : ''}" style="min-height:52px;font-size:17px" onclick="votarVirtual('${v.id}','${it.id}','${x}','${esc(it.numero)}')">${PL.VOTOS[x]}</button>`).join('')}</div>
              ${meu ? `<p class="detalhe" style="margin:6px 0 0">Seu voto: <b>${PL.VOTOS[meu]}</b></p>` : ''}` : ''}
          ${v.status !== 'agendada' ? `<div class="detalhe tnum" style="margin-top:6px">Parcial: sim ${c.sim} · não ${c.nao} · abst. ${c.abst}</div>` : ''}
          ${it.manifestacoes.length ? `<details style="margin-top:6px;font-size:13px"><summary class="suave" style="cursor:pointer">${it.manifestacoes.length} manifestação(ões)</summary>${it.manifestacoes.map(m => `<p style="margin:6px 0"><b>${esc(m.nome)}</b> <small class="suave">${dtv(m.ts)}</small><br>${esc(m.texto)}</p>`).join('')}</details>` : ''}
          ${v.status === 'aberta' && !destacado && !it.resultado ? `<details style="margin-top:8px"><summary class="suave" style="cursor:pointer;font-size:13px">Manifestar-se ou pedir destaque</summary>
            <textarea class="campo" rows="3" style="margin-top:8px" placeholder="Sua manifestação por escrito (fica pública e vai para a ata)" oninput="rascunhos['${it.id}']=this.value">${esc(rascunhos[it.id] || '')}</textarea>
            <div class="grupo" style="margin-top:6px"><button class="botao pq" onclick="manifestar('${v.id}','${it.id}')">Enviar manifestação</button>
            <button class="botao pq fantasma" onclick="destacar('${v.id}','${it.id}')">Pedir destaque</button></div></details>` : ''}
        </div>`;
      }).join('') || '<p class="vazio">Sem itens.</p>'}
    </div>`).join('') : '<div class="cartao neutro"><p class="vazio" style="margin:0">Nenhuma sessão virtual no momento.</p></div>';
}
async function votarVirtual(vid, itemId, valor, numero) {
  const pin = await PL.pedirPin(`Voto ${PL.VOTOS[valor]} em ${numero}.`);
  if (!pin) return;
  try { await PL.acao('parlamentar', 'virtualVotar', { vid, itemId, valor, pin }); navigator.vibrate?.(30); PL.avisar('Voto registrado.'); }
  catch (e) { if (e.codigo === 'pin') PL.esquecerPin(); }
}
async function destacar(vid, itemId) {
  if (!confirm('Pedir destaque? O item sai da sessão virtual e será votado na sessão presencial; os votos já dados são descartados.')) return;
  const pin = await PL.pedirPin('Pedido de destaque.');
  if (!pin) return;
  try { await PL.acao('parlamentar', 'virtualDestaque', { vid, itemId, pin }); } catch (e) { if (e.codigo === 'pin') PL.esquecerPin(); }
}
async function manifestar(vid, itemId) {
  try { await PL.acao('parlamentar', 'virtualManifestar', { vid, itemId, texto: rascunhos[itemId] || '' }); rascunhos[itemId] = ''; document.activeElement?.blur(); PL.avisar('Manifestação registrada.'); desenharVirtualParl(); } catch {}
}
PL.aoMudar(S => {
  if (!eu) return;
  const abertas = S.virtuais.filter(v => v.status === 'aberta' && v.itens.some(it => !it.votos[eu.pid] && !it.destaques.length)).length;
  $('bolhaVirtual').textContent = abertas ? '●' : '';
  $('bolhaVirtual').style.color = 'var(--ambar)';
  desenharVirtualParl();
});

/* ---------------- ideias de projetos (recomendações) ---------------- */
let aba = 'plenario', R = null, revCarregada = null, escopo = '';
document.querySelectorAll('[data-aba]').forEach(b => b.onclick = () => {
  aba = b.dataset.aba;
  document.querySelectorAll('[data-aba]').forEach(x => x.classList.toggle('ativo', x === b));
  if (aba === 'plenario') desenhar(); else if (aba === 'virtual') desenharVirtualParl(); else if (aba === 'pauta') desenharPauta(); else carregarIdeias();
  scrollTo(0, 0);
});
PL.aoMudar(S => { if (eu && ['ideias', 'minhas'].includes(aba) && S.projetosRev !== revCarregada) carregarIdeias(); });
PL.aoMudar(() => { if (eu && aba === 'pauta') desenharPauta(); });
async function carregarIdeias() {
  revCarregada = PL.estado?.projetosRev;
  const r = await fetch('/api/recomendacoes', { headers: { Authorization: 'Bearer ' + PL.token('parlamentar') } });
  if (r.status === 401) { localStorage.removeItem('parlatorio.token.parlamentar'); return location.reload(); }
  R = await r.json();
  aba === 'ideias' ? desenharIdeias() : desenharMinhas();
}
const EVID = { forte: 'sim', moderada: 'ambar', limitada: '' };
const CUSTO = { baixo: 'Custo baixo', medio: 'Custo médio', alto: 'Custo alto' };
let verDescartadas = false;
function desenharIdeias() {
  const descartadas = R.itens.filter(i => i.feedback === 'descartado');
  const lista = R.itens.filter(i => (verDescartadas || i.feedback !== 'descartado')
    && (escopo === 'salvas' ? i.feedback === 'salvo' : !escopo || i.escopo === escopo));
  $('conteudoApp').innerHTML = `
    <div class="cartao"><h2>Seu perfil</h2>
      <p class="detalhe" style="margin-top:0">As sugestões usam suas áreas, os temas que você escrever, o texto dos seus projetos, o que você salva ou descarta e as lacunas da cidade.</p>
      <div class="opcoes">${Object.entries(R.areas).filter(([k]) => k !== 'outros').map(([k, v]) => `<button class="${R.interesses.includes(k) ? 'on' : ''}" onclick="alternarInteresse('${k}')" aria-pressed="${R.interesses.includes(k)}">${esc(v)}</button>`).join('')}</div>
      <label class="rot" style="margin-top:12px">Temas que você defende (palavras ou frases)
        <textarea class="campo" id="temas" rows="2" placeholder="Ex.: hortas nas escolas, ciclovias, primeira infância, combate à fome">${esc(R.temas)}</textarea></label>
      <small class="suave" id="temasStatus"></small></div>
    <div class="opcoes" role="group" aria-label="Filtro">${[['', 'Todas'], ['Brasil', 'No Brasil'], ['Mundo', 'No mundo'], ['salvas', `★ Salvas (${R.itens.filter(i => i.feedback === 'salvo').length})`]].map(([k, v]) => `<button class="${escopo === k ? 'on' : ''}" onclick="escopo='${k}';desenharIdeias()">${v}</button>`).join('')}</div>
    ${lista.length ? '' : `<div class="cartao neutro"><p class="vazio" style="margin:0">${escopo === 'salvas' ? 'Você ainda não salvou nenhuma ideia. Use ☆ Salvar nos cartões.' : 'Nenhuma ideia neste filtro.'}</p></div>`}
    ${lista.map(i => `<article class="cartao ideia ${i.situacao || i.feedback === 'descartado' ? 'neutro' : ''}" ${i.feedback === 'descartado' ? 'style="opacity:.6"' : ''}>
      <div style="display:flex;gap:8px;align-items:flex-start"><div style="flex:1"><h3>${esc(i.titulo)}</h3><div class="local">${esc(i.local)} · ${i.escopo === 'Mundo' ? 'experiência internacional' : 'experiência brasileira'}</div></div>
        <button class="botao pq ${i.feedback === 'salvo' ? 'principal' : 'fantasma'}" onclick="darFeedback('${i.id}','${i.feedback === 'salvo' ? '' : 'salvo'}')" aria-pressed="${i.feedback === 'salvo'}">${i.feedback === 'salvo' ? '★ Salva' : '☆ Salvar'}</button></div>
      <div class="afinidade" title="Nota de recomendação para você"><span class="barra"><i style="width:${i.nota}%"></i></span><b>${i.nota}</b></div>
      <ul>${i.motivos.map(m => `<li>${esc(m)}</li>`).join('')}</ul>
      ${i.parecido ? `<p class="chip ambar" style="margin:4px 0;white-space:normal">Já existe projeto parecido na cidade: ${esc(i.parecido.numero)} (${SIT_PROJ[i.parecido.situacao] || i.parecido.situacao})</p>` : ''}
      <p>${esc(i.resumo)}</p>
      <div class="rotulo">Resultados relatados</div><p>${esc(i.resultados)}</p>
      <div class="grupo"><span class="chip ${EVID[i.evidencia]}">Evidência ${i.evidencia}</span><span class="chip">${CUSTO[i.custo]}</span></div>
      <p class="detalhe">${esc(i.notaEvidencia)}</p>
      <div class="rotulo">Como propor na Câmara</div><p>${esc(i.instrumento)}</p>
      <details class="fontes"><summary class="rotulo" style="cursor:pointer">Fontes (${i.fontes.length})</summary>${i.fontes.map(f => `<a href="${esc(PL.urlSegura(f.url))}" target="_blank" rel="noopener noreferrer">${esc(f.titulo)}</a>`).join('')}</details>
      <div style="margin-top:12px;display:flex;flex-direction:column;gap:8px">${i.situacao === 'proposto_por_voce' ? '<span class="chip sim">✓ Você já propôs</span>'
        : `<button class="botao principal" onclick="abrirProposta('${i.id}')">Propor este projeto</button>${i.situacao === 'proposto_por_outro' ? '<p class="detalhe" style="margin:0">Outro parlamentar já apresentou proposta inspirada nesta prática.</p>' : ''}`}
        ${i.feedback === 'descartado' ? `<button class="botao pq fantasma" onclick="darFeedback('${i.id}','')">Voltar a recomendar</button>`
          : `<button class="botao pq fantasma" onclick="darFeedback('${i.id}','descartado')">Não me interessa</button>`}</div>
    </article>`).join('')}
    ${descartadas.length ? `<button class="botao fantasma" onclick="verDescartadas=!verDescartadas;desenharIdeias()">${verDescartadas ? 'Esconder' : 'Mostrar'} ${descartadas.length} ideia(s) descartada(s)</button>` : ''}
    <p class="detalhe" style="text-align:center">Catálogo de boas práticas pesquisado em novembro de 2026. Confira as fontes antes de citar números.</p>`;
  $('temas').onchange = async () => {
    $('temasStatus').textContent = 'Salvando…';
    await A('perfilInteresses', { temas: $('temas').value });
    await carregarIdeias();
    PL.avisar('Temas salvos. Recomendações atualizadas.');
  };
}
async function darFeedback(id, valor) {
  await A('feedbackPratica', { praticaId: id, valor: valor || null });
  if (valor === 'descartado') PL.avisar('Ideia descartada. Ela não aparece mais na lista.');
  await carregarIdeias();
}
async function alternarInteresse(area) {
  const novo = R.interesses.includes(area) ? R.interesses.filter(a => a !== area) : [...R.interesses, area];
  await A('perfilInteresses', { areas: novo });
  await carregarIdeias();
}
function abrirProposta(id) {
  const i = R.itens.find(x => x.id === id);
  $('formPropor').innerHTML = `<h2 style="font-size:18px">Propor: ${esc(i.titulo)}</h2>
    <p class="detalhe" style="margin:0">Inspirado em ${esc(i.local)}. A secretaria recebe a proposta, revisa e protocola com número oficial.</p>
    <label class="rot">Ementa (adapte à realidade da cidade)<textarea class="campo" id="pEmenta" rows="4">${esc(i.ementaSugerida)}</textarea></label>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <label class="rot">Pessoas que podem ser beneficiadas<input class="campo" type="number" min="0" id="pBenef" placeholder="estimativa"></label>
      <label class="rot">Abrangência<select class="campo" id="pAbr"><option value="">—</option>${Object.entries(R.abrangenciaNomes).map(([k, v]) => `<option value="${k}">${esc(v)}</option>`).join('')}</select></label>
    </div>
    <label class="rot">Justificativa (opcional)<textarea class="campo" id="pJust" rows="4" placeholder="Por que a cidade precisa disso? Dados locais, bairros, público…"></textarea></label>
    <p class="detalhe" style="margin:0">Instrumento sugerido: ${esc(i.instrumento)}</p>
    <div class="grupo" style="justify-content:flex-end"><button class="botao fantasma" onclick="dlgPropor.close()">Cancelar</button>
      <button class="botao principal" onclick="enviarProposta('${id}')">Enviar proposta</button></div>`;
  dlgPropor.showModal();
}
async function enviarProposta(id) {
  try {
    await PL.acao('parlamentar', 'propor', { praticaId: id, ementa: $('pEmenta').value, beneficiados: +$('pBenef').value || 0, abrangencia: $('pAbr').value, justificativa: $('pJust').value });
    dlgPropor.close(); PL.avisar('Proposta enviada à secretaria.'); carregarIdeias();
  } catch {}
}
const SIT_PROJ = { proposta: 'Aguardando protocolo', em_tramitacao: 'Em tramitação', em_pauta: 'Em pauta', aprovada: 'Aprovado', rejeitada: 'Rejeitado', retirada: 'Retirado', arquivado: 'Arquivado' };
function desenharMinhas() {
  const titulo = id => R.itens.find(i => i.id === id)?.titulo;
  $('conteudoApp').innerHTML = R.minhas.length ? R.minhas.map(p => `<div class="cartao ${p.situacao === 'proposta' ? '' : 'neutro'}">
      <div class="grupo" style="justify-content:space-between;align-items:center"><b>${esc(p.numero)}</b>
        <span class="chip ${p.situacao === 'aprovada' ? 'sim' : p.situacao === 'rejeitada' ? 'nao' : p.situacao === 'proposta' ? 'ambar' : ''}">${SIT_PROJ[p.situacao] || p.situacao}</span></div>
      <p style="margin:8px 0">${esc(p.ementa)}</p>
      ${p.origem ? `<p class="detalhe" style="margin:0">Inspirado em: ${esc(titulo(p.origem) || p.origem)}</p>` : ''}
      ${p.situacao === 'proposta' ? `<button class="botao pq fantasma" style="margin-top:10px" onclick="if(confirm('Retirar esta proposta?'))A('retirarProposta',{id:'${p.id}'}).then(carregarIdeias)">Retirar proposta</button>` : ''}
    </div>`).join('') : '<div class="cartao neutro"><p class="vazio" style="margin:0">Você ainda não tem projetos ou propostas. Veja a aba “Ideias de projetos”.</p></div>';
}

async function perguntarRegimento() {
  const pergunta = $('rgPergunta').value.trim(); if (pergunta.length < 5) return;
  $('rgResposta').textContent = '⏳ Procurando nos artigos…';
  const r = await fetch('/api/regimento/perguntar', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + PL.token('parlamentar') },
    body: JSON.stringify({ pergunta }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { $('rgResposta').textContent = j.erro || 'Não foi possível consultar.'; return; }
  $('rgResposta').innerHTML = (j.resposta ? `<div style="white-space:pre-wrap;margin-bottom:6px">${esc(j.resposta)}</div>` : '')
    + (j.seloIA ? `<small class="suave">${esc(j.seloIA)}</small>` : '')
    + (j.fontes || []).map((f, k) => `<details style="margin-top:4px"><summary>[${k + 1}] ${esc(f.norma)}, art. ${esc(f.artigo)}</summary><div style="white-space:pre-wrap;font-size:13px;margin:4px 0 0 10px">${esc(f.texto)}</div></details>`).join('');
}
function orientar(o) { PL.acao('parlamentar', 'orientar', { orientacao: o }).catch(() => {}); }
function votar(x) {
  const v = PL.estado.votacao;
  if (v.tipo === 'secreta' && !confirm(`Confirmar voto “${PL.VOTOS[x]}”? Na votação secreta não é possível alterar.`)) return;
  PL.acao('parlamentar', 'votar', { valor: x }).then(() => confirmarVoto(PL.VOTOS[x])).catch(() => {});
}
/* retorno do voto para quem não enxerga a tela: vibração, som e leitor de tela */
function confirmarVoto(rotulo) {
  navigator.vibrate?.([80, 60, 80]);
  try {
    const ctx = new AudioContext(), o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = 880; g.gain.value = 0.15; o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.18); setTimeout(() => ctx.close(), 400);
  } catch { }
  $('anuncio').textContent = '';
  setTimeout(() => { $('anuncio').textContent = `Voto ${rotulo} registrado.`; }, 50);
  PL.avisar(`Voto “${rotulo}” registrado.`);
}
function alternarAcessivel() {
  const ligado = document.documentElement.classList.toggle('acessivel');
  localStorage.setItem('parlatorio.acessivel', ligado ? '1' : '');
  desenhar();
}
if (localStorage.getItem('parlatorio.acessivel')) document.documentElement.classList.add('acessivel');

/* ---------------- pauta da sessão no celular ---------------- */
const SIT_PAUTA = { pendente: ['', 'Aguardando'], em_discussao: ['ambar', 'Em discussão'], em_votacao: ['ambar', 'Em votação'],
  aprovada: ['sim', 'Aprovada'], rejeitada: ['nao', 'Rejeitada'], adiada: ['', 'Adiada'], retirada: ['', 'Retirada'], sem_quorum: ['nao', 'Sem quórum'] };
function desenharPauta() {
  const S = PL.estado;
  if (aba !== 'pauta') return;
  const votos = Object.fromEntries(S.votacoes.map(v => [v.materia, v]));
  $('conteudoApp').innerHTML = `<div class="cartao neutro"><b>${esc(S.casa.titulo)}</b> · ${S.pauta.length} matéria(s) na pauta</div>` +
    (S.pauta.length ? S.pauta.map((m, k) => {
      const [cor, rot] = SIT_PAUTA[m.situacao] || ['', m.situacao];
      const v = votos[m.id], c = v?.contagem;
      return `<div class="cartao pauta-item ${S.materiaAtual === m.id ? 'atual' : ''}">
        <div class="grupo" style="justify-content:space-between;align-items:center"><b>${k + 1}. ${esc(m.numero)}</b>
          <span class="chip ${cor}">${S.materiaAtual === m.id ? 'Agora · ' : ''}${rot}</span></div>
        <p style="margin:8px 0">${esc(m.ementa)}</p>
        ${m.autor ? `<p class="detalhe" style="margin:0">Autoria: ${esc(m.autor)}</p>` : ''}
        ${v && v.resultado ? `<p class="detalhe" style="margin:6px 0 0">Resultado: <b>${esc(SIT_PAUTA[v.resultado]?.[1] || v.resultado)}</b>${c ? ` — ${c.sim} sim, ${c.nao} não, ${c.abst} abstenções` : ''}</p>` : ''}
        <div class="grupo" style="margin-top:8px">
          ${m.anexo ? `<a class="botao pq" href="/anexo/${m.id}.pdf?v=${m.anexo.v}" target="_blank" rel="noopener">📄 ${esc(m.anexo.nome)}</a>` : ''}
          <a class="botao pq fantasma" href="/participe#${m.id}" target="_blank" rel="noopener">Texto e contribuições</a></div>
      </div>`;
    }).join('') : '<div class="cartao neutro"><p class="vazio" style="margin:0">Nenhuma matéria na pauta.</p></div>');
}
function relogios() {
  const S = PL.estado; if (!S) return;
  $('hora').textContent = PL.relogio().slice(0, 5);
  if (!eu) return;
  if (S.orador) PL.pintar(S.orador, $('tOrador'));
  if (S.orador?.pid === eu.pid) PL.pintar(S.orador, $('tEu'), $('bEu'));
  if (S.interr?.pid === eu.pid) PL.pintar(S.interr, $('tEu'), $('bEu'));
}
setInterval(relogios, 250);
iniciar();
</script>
