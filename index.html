<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plenário — Controle de Tempo de Fala</title>
<style>
:root{
  --bg:#0b1220;--panel:#121b2e;--panel2:#18233a;--line:#26324d;--txt:#e7ecf5;--mut:#8b97b0;
  --acc:#d4a72c;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--blue:#3b82f6;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--acc)}
button:disabled{opacity:.4;cursor:not-allowed}
button.pri{background:var(--acc);color:#1a1405;border-color:var(--acc);font-weight:600}
button.ok{background:var(--ok);color:#04210f;border-color:var(--ok);font-weight:600}
button.bad{background:var(--bad);color:#fff;border-color:var(--bad);font-weight:600}
button.sm{padding:4px 8px;font-size:13px}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.tnum{font-variant-numeric:tabular-nums}
.mut{color:var(--mut)}
.hidden{display:none!important}

/* ---------- ADMIN ---------- */
#admin header{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
#admin header h1{font-size:17px;margin:0;font-weight:600}
#admin header .sp{flex:1}
#clockA{font-size:20px;font-weight:600}
.grid{display:grid;grid-template-columns:320px 1fr 320px;gap:16px;padding:16px 20px;align-items:start}
@media(max-width:1100px){.grid{grid-template-columns:1fr 1fr}.grid>:nth-child(2){grid-column:1/-1;order:-1}}
@media(max-width:700px){.grid{grid-template-columns:1fr}.bigtime{font-size:64px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:0 0 10px;font-weight:600}
.fases{display:flex;flex-direction:column;gap:4px}
.fase{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.fase:hover{background:var(--panel2)}
.fase.on{background:var(--panel2);border-color:var(--acc)}
.fase .badge{font-size:12px;background:var(--bg);padding:2px 8px;border-radius:99px;color:var(--mut)}
.fila{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.fila li{display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--panel2);border-radius:8px}
.fila li .n{width:22px;color:var(--mut);font-size:13px}
.fila li .nm{flex:1;min-width:0}
.fila li .nm small{display:block;color:var(--mut);font-size:12px}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;color:#fff}
.stage{text-align:center;padding:24px 18px}
.stage .who{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:8px}
.stage .who .av{width:64px;height:64px;font-size:22px}
.stage .who .nm{text-align:left;font-size:22px;font-weight:600}
.stage .who .nm small{display:block;font-size:14px;color:var(--mut);font-weight:400}
.bigtime{font-size:96px;font-weight:700;line-height:1;margin:12px 0}
.bar{height:10px;background:var(--bg);border-radius:99px;overflow:hidden;margin:0 auto 16px;max-width:520px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .2s linear}
.st-ok{color:var(--ok)}.st-warn{color:var(--warn)}.st-bad{color:var(--bad)}
.bar.warn i{background:var(--warn)}.bar.bad i{background:var(--bad)}
.blink{animation:blink 1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);text-transform:uppercase;letter-spacing:.05em}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--mut)}
.chip.live .dot{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.chip.cut .dot{background:var(--bad)}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
.interr{margin-top:16px;padding:12px;border:1px dashed var(--blue);border-radius:10px;display:flex;align-items:center;gap:12px;justify-content:center}
.interr .t{font-size:32px;font-weight:700}
.parls{display:flex;flex-direction:column;gap:4px;max-height:360px;overflow:auto}
.parls .p{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:8px}
.parls .p:hover{background:var(--panel2)}
.parls .p .nm{flex:1;font-size:14px}
.parls .p .nm small{color:var(--mut)}
.parls .p .act{display:flex;gap:4px;opacity:.85}
.hist{font-size:13px;display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto}
.hist div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding-bottom:4px}
.kbd{font-size:12px;color:var(--mut);text-align:center;margin-top:14px}
.kbd b{border:1px solid var(--line);border-radius:4px;padding:0 5px;font-weight:500}
dialog{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:14px;padding:0;width:min(720px,94vw)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog .hd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
dialog .bd{padding:16px 18px;max-height:70vh;overflow:auto;display:flex;flex-direction:column;gap:16px}
dialog table{width:100%;border-collapse:collapse}
dialog td{padding:4px}
dialog label.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.search{width:100%;margin-bottom:8px}

/* ---------- TELÃO ---------- */
#telao{height:100vh;display:flex;flex-direction:column;background:radial-gradient(ellipse at top,#16223d,#070c17 70%)}
#telao .top{display:flex;justify-content:space-between;align-items:center;padding:2.2vh 3vw;border-bottom:2px solid var(--acc)}
#telao .top .casa{font-size:2.4vh;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);font-weight:700}
#telao .top .sess{font-size:2vh;color:var(--mut)}
#telao .top .clk{font-size:4vh;font-weight:700}
#telao .fasebar{text-align:center;font-size:4.2vh;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2.5vh 0 0}
#telao .main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5vh;padding:0 4vw}
#telao .tav{width:18vh;height:18vh;font-size:7vh;border:4px solid var(--acc)}
#telao .tnome{font-size:7vh;font-weight:700;text-align:center;line-height:1.1}
#telao .tpart{font-size:3.4vh;color:var(--mut)}
#telao .ttime{font-size:24vh;font-weight:800;line-height:1}
#telao .bar{width:60vw;max-width:none;height:2vh}
#telao .tstat{font-size:2.6vh}
#telao .chip{font-size:2.2vh;padding:.8vh 2vh}
#telao .chip .dot{width:1.6vh;height:1.6vh}
#telao .idle{font-size:5vh;color:var(--mut);text-align:center}
#telao .interrT{position:fixed;right:3vw;top:14vh;background:#0f1b33;border:3px solid var(--blue);border-radius:2vh;padding:2vh 3vh;min-width:30vw}
#telao .interrT .lbl{font-size:2.4vh;color:var(--blue);font-weight:700;letter-spacing:.1em;text-transform:uppercase}
#telao .interrT .nm{font-size:4vh;font-weight:700}
#telao .interrT .t{font-size:8vh;font-weight:800}
#telao .next{padding:2vh 3vw;border-top:1px solid var(--line);display:flex;gap:2vw;align-items:center;font-size:2.6vh;min-height:9vh}
#telao .next .lbl{color:var(--acc);font-weight:700;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
#telao .next .it{display:flex;align-items:center;gap:1vh;white-space:nowrap}
#telao .next .it .av{width:5vh;height:5vh;font-size:2vh}
</style>
</head>
<body>

<!-- ================= ADMIN ================= -->
<div id="admin" class="hidden">
  <header>
    <h1 id="hTitulo"></h1>
    <span class="mut" id="hSub"></span>
    <div class="sp"></div>
    <span id="clockA" class="tnum"></span>
    <button onclick="abrirTelao()">Abrir telão ↗</button>
    <button onclick="exportarAta()">Exportar ata (CSV)</button>
    <button onclick="abrirConfig()">Configurações</button>
  </header>
  <div class="grid">
    <!-- Coluna esquerda: fases e fila -->
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="card"><h2>Fases da sessão</h2><div class="fases" id="fases"></div></div>
      <div class="card">
        <h2 id="filaTit">Inscritos</h2>
        <ol class="fila" id="fila"></ol>
        <div class="mut" id="filaVazia" style="font-size:14px">Nenhum inscrito. Clique em “+ Inscrever” na lista de parlamentares.</div>
      </div>
    </div>

    <!-- Centro: orador -->
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="card stage" id="stage"></div>
      <div class="card">
        <h2>Histórico de pronunciamentos</h2>
        <div class="hist" id="hist"></div>
      </div>
    </div>

    <!-- Direita: parlamentares -->
    <div class="card">
      <h2>Parlamentares</h2>
      <input class="search" id="busca" placeholder="Buscar nome ou partido…" oninput="renderParls()">
      <div class="parls" id="parls"></div>
    </div>
  </div>
</div>

<!-- ================= TELÃO ================= -->
<div id="telao" class="hidden">
  <div class="top">
    <div><div class="casa" id="tCasa"></div><div class="sess" id="tSess"></div></div>
    <div class="clk tnum" id="tClock"></div>
  </div>
  <div class="fasebar" id="tFase"></div>
  <div class="main" id="tMain"></div>
  <div class="next" id="tNext"></div>
  <div class="interrT hidden" id="tInterr"></div>
</div>

<!-- ================= CONFIG ================= -->
<dialog id="dlg">
  <div class="hd"><b>Configurações</b><button class="sm" onclick="dlg.close()">Fechar</button></div>
  <div class="bd">
    <div>
      <h3 style="margin:0 0 8px">Sessão</h3>
      <table>
        <tr><td>Casa legislativa</td><td><input id="cCasa" style="width:100%"></td></tr>
        <tr><td>Título da sessão</td><td><input id="cTit" style="width:100%"></td></tr>
      </table>
    </div>
    <div>
      <h3 style="margin:0 0 8px">Fases e tempo por orador (minutos)</h3>
      <table id="cFases"></table>
      <button class="sm" onclick="addFaseCfg()">+ Fase</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <h3 style="margin:0">Regras</h3>
      <label class="row">Aviso amarelo quando restarem (segundos) <input type="number" id="cAlerta" min="0" style="width:90px"></label>
      <label class="row">Tempo máximo de aparte (segundos) <input type="number" id="cAparte" min="10" style="width:90px"></label>
      <label class="row">Tempo de questão de ordem / pela ordem (segundos) <input type="number" id="cOrdem" min="10" style="width:90px"></label>
      <label class="row">Aparte desconta do tempo do orador <input type="checkbox" id="cDesconta"></label>
      <label class="row">Cortar microfone automaticamente ao fim do tempo <input type="checkbox" id="cCorte"></label>
      <label class="row">Sinal sonoro (aviso e fim do tempo) <input type="checkbox" id="cSom"></label>
    </div>
    <div>
      <h3 style="margin:0 0 8px">Parlamentares</h3>
      <table id="cParls"></table>
      <div style="display:flex;gap:6px;margin-top:6px">
        <input id="nNome" placeholder="Nome parlamentar" style="flex:1"><input id="nPart" placeholder="Partido" style="width:110px">
        <button class="sm" onclick="addParl()">Adicionar</button>
      </div>
    </div>
    <div style="display:flex;gap:8px;justify-content:space-between">
      <button class="bad sm" onclick="resetTudo()">Zerar sessão (apaga filas e histórico)</button>
      <button class="pri" onclick="salvarConfig()">Salvar configurações</button>
    </div>
  </div>
</dialog>

<script>
/* ================= Estado & sincronização =================
   O painel administrativo é a única fonte de escrita. O estado vai para
   localStorage + BroadcastChannel; o telão (outra aba/monitor) só lê.
   Os cronômetros guardam timestamps, então todas as telas mostram o mesmo
   tempo sem depender de mensagens a cada segundo. */
const KEY = 'plenario.v1';
const bc = 'BroadcastChannel' in window ? new BroadcastChannel('plenario') : null;
const IS_TELAO = location.hash === '#telao';
const uid = () => Math.random().toString(36).slice(2, 9);

function defaults() {
  const nomes = [
    ['Ana Beatriz Moura','PSD'],['Carlos Eduardo Lima','PT'],['Fernanda Rocha','MDB'],['João Batista Neto','PL'],
    ['Juliana Prado','PSB'],['Marcos Vinícius Teles','UNIÃO'],['Patrícia Albuquerque','PSDB'],['Ricardo Menezes','PP'],
    ['Sandra Oliveira','REPUBLICANOS'],['Tiago Fontes','PDT'],['Vera Lúcia Campos','PSOL'],['Wagner Siqueira','PODE'],
    ['Helena Castro','REDE'],['Otávio Brandão','NOVO'],['Luana Ferraz','PCdoB']
  ];
  return {
    casa: 'Câmara Municipal',
    titulo: '45ª Sessão Ordinária',
    cfg: { alerta: 60, aparte: 60, ordem: 180, desconta: true, corte: true, som: true },
    fases: [
      { id: 'pe', nome: 'Pequeno Expediente', min: 5 },
      { id: 'ge', nome: 'Grande Expediente', min: 15 },
      { id: 'cl', nome: 'Comunicações de Liderança', min: 5 },
      { id: 'od', nome: 'Ordem do Dia — Discussão', min: 10 },
      { id: 'ev', nome: 'Encaminhamento de Votação', min: 5 },
      { id: 'ep', nome: 'Explicação Pessoal', min: 5 },
      { id: 'tl', nome: 'Tribuna Livre', min: 10 }
    ],
    parls: nomes.map(([nome, partido]) => ({ id: uid(), nome, partido })),
    faseAtual: 'pe',
    filas: {},
    orador: null,      // {pid, fase, total, acc, start, mic, extra, inicio, apartes:[], alertou, esgotou}
    interr: null,      // {tipo, pid, total, acc, start, pausouOrador}
    hist: []
  };
}

let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || defaults(); } catch { S = defaults(); }

function commit() {
  localStorage.setItem(KEY, JSON.stringify(S));
  bc && bc.postMessage(S);
  render();
}
bc && (bc.onmessage = e => { S = e.data; render(); });
addEventListener('storage', e => { if (e.key === KEY && e.newValue) { S = JSON.parse(e.newValue); render(); } });

/* ================= Utilidades ================= */
const $ = id => document.getElementById(id);
const P = id => S.parls.find(p => p.id === id) || { nome: '(removido)', partido: '' };
const F = id => S.fases.find(f => f.id === id) || { nome: '?', min: 5 };
const fila = (f = S.faseAtual) => (S.filas[f] ||= []);
const elapsed = t => t.acc + (t.start ? Date.now() - t.start : 0);
const remaining = t => t.total - elapsed(t);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function fmt(ms) {
  const neg = ms < 0; ms = Math.abs(ms);
  const s = neg ? Math.floor(ms / 1000) : Math.ceil(ms / 1000);
  return (neg ? '+' : '') + String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}
const hhmm = ts => new Date(ts).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
function initials(n) { const p = n.split(' ').filter(w => w.length > 2); return ((p[0] || n)[0] + ((p[p.length - 1] || '')[0] || '')).toUpperCase(); }
function color(n) { let h = 0; for (const c of n) h = (h * 31 + c.charCodeAt(0)) % 360; return `hsl(${h} 45% 38%)`; }
const av = p => `<div class="av" style="background:${color(p.nome)}">${esc(initials(p.nome))}</div>`;
function level(t) {
  const r = remaining(t);
  return r <= 0 ? 'bad' : r <= S.cfg.alerta * 1000 ? 'warn' : 'ok';
}
let actx;
function beep(freq = 880, dur = 0.25, n = 1) {
  if (!S.cfg.som) return;
  try {
    actx ||= new AudioContext();
    for (let i = 0; i < n; i++) {
      const o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime + i * (dur + 0.12);
      o.frequency.value = freq; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.2, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      o.start(t0); o.stop(t0 + dur);
    }
  } catch {}
}

/* ================= Ações do presidente ================= */
function setFase(id) { S.faseAtual = id; commit(); }
function inscrever(pid) {
  const f = fila();
  if (f.includes(pid)) return;
  f.push(pid); commit();
}
function desinscrever(pid) { S.filas[S.faseAtual] = fila().filter(x => x !== pid); commit(); }
function mover(pid, d) {
  const f = fila(), i = f.indexOf(pid), j = i + d;
  if (j < 0 || j >= f.length) return;
  [f[i], f[j]] = [f[j], f[i]]; commit();
}
function chamar(pid) {
  if (S.orador) finalizar();
  S.filas[S.faseAtual] = fila().filter(x => x !== pid);
  S.orador = { pid, fase: S.faseAtual, total: F(S.faseAtual).min * 60000, acc: 0, start: null, mic: false, extra: 0, inicio: null, apartes: [], alertou: false, esgotou: false };
  commit();
}
function proximo() { const f = fila(); if (f.length) chamar(f[0]); else if (S.orador) { finalizar(); commit(); } }
function iniciar() {
  const o = S.orador; if (!o || o.start || S.interr?.pausouOrador) return;
  o.start = Date.now(); o.mic = true; o.inicio ||= o.start; commit();
}
function pausar() {
  const o = S.orador; if (!o || !o.start) return;
  o.acc += Date.now() - o.start; o.start = null; o.mic = false; commit();
}
function alternar() { S.orador?.start ? pausar() : iniciar(); }
function addTempo(seg) {
  const o = S.orador; if (!o) return;
  o.total += seg * 1000; o.extra += seg;
  if (remaining(o) > 0) { o.esgotou = false; if (remaining(o) > S.cfg.alerta * 1000) o.alertou = false; }
  commit();
}
function finalizar() {
  const o = S.orador; if (!o) return;
  if (S.interr) encerrarInterr(true);
  if (o.start) { o.acc += Date.now() - o.start; o.start = null; }
  if (o.inicio) S.hist.unshift({ pid: o.pid, nome: P(o.pid).nome, partido: P(o.pid).partido, fase: F(o.fase).nome,
    previsto: F(o.fase).min * 60, extra: o.extra, usado: Math.round(o.acc / 1000), inicio: o.inicio, fim: Date.now(), apartes: o.apartes });
  S.orador = null;
}
function encerrar() { finalizar(); commit(); }

function interromper(tipo, pid) {
  const o = S.orador; if (!o || S.interr) return;
  const desconta = tipo === 'aparte' && S.cfg.desconta;
  let pausou = false;
  if (!desconta && o.start) { o.acc += Date.now() - o.start; o.start = null; pausou = true; }
  o.mic = false;
  S.interr = { tipo, pid, total: (tipo === 'aparte' ? S.cfg.aparte : S.cfg.ordem) * 1000, acc: 0, start: Date.now(), pausouOrador: pausou, oradorRodando: !!o.start || pausou };
  commit();
}
function encerrarInterr(silencioso) {
  const i = S.interr, o = S.orador; if (!i) return;
  const usado = Math.round(elapsed(i) / 1000);
  if (o) {
    o.apartes.push({ tipo: i.tipo, nome: P(i.pid).nome, usado });
    if (i.pausouOrador && !silencioso) { o.start = Date.now(); }
    if (o.start) o.mic = true;
  }
  S.interr = null;
  if (!silencioso) commit();
}
const TIPOS = { aparte: 'Aparte', ordem: 'Questão de ordem', pelaordem: 'Pela ordem' };

/* ================= Tick do administrador (regras automáticas) ================= */
function tickAdmin() {
  const o = S.orador, i = S.interr; let mudou = false;
  if (o && o.start) {
    const r = remaining(o);
    if (!o.alertou && r <= S.cfg.alerta * 1000 && r > 0) { o.alertou = true; beep(660, .2, 1); mudou = true; }
    if (!o.esgotou && r <= 0) {
      o.esgotou = true; beep(440, .35, 3); mudou = true;
      if (S.cfg.corte) { o.acc = o.total; o.start = null; o.mic = false; if (i && !i.pausouOrador) encerrarInterr(true); }
    }
  }
  if (S.interr && S.interr.start && remaining(S.interr) <= 0 && S.cfg.corte) {
    beep(440, .25, 2); encerrarInterr(true); mudou = true;
  }
  if (mudou) commit();
}

/* ================= Render ================= */
function render() { IS_TELAO ? renderTelao() : renderAdmin(); }

function statusChip(o) {
  if (!o.inicio) return `<span class="chip"><span class="dot"></span>Aguardando início</span>`;
  if (o.esgotou && !o.start) return `<span class="chip cut"><span class="dot"></span>Tempo esgotado · microfone cortado</span>`;
  if (S.interr) return `<span class="chip"><span class="dot" style="background:var(--blue)"></span>${TIPOS[S.interr.tipo]} em curso</span>`;
  if (o.start) return `<span class="chip live"><span class="dot"></span>Com a palavra · microfone aberto</span>`;
  return `<span class="chip"><span class="dot"></span>Pausado · microfone fechado</span>`;
}

function renderAdmin() {
  $('hTitulo').textContent = S.casa; $('hSub').textContent = S.titulo;
  $('fases').innerHTML = S.fases.map(f => `<div class="fase ${f.id === S.faseAtual ? 'on' : ''}" onclick="setFase('${f.id}')">
    <span>${esc(f.nome)} <small class="mut">· ${f.min} min</small></span><span class="badge">${(S.filas[f.id] || []).length}</span></div>`).join('');
  $('filaTit').textContent = 'Inscritos — ' + F(S.faseAtual).nome;
  const f = fila();
  $('filaVazia').classList.toggle('hidden', f.length > 0);
  $('fila').innerHTML = f.map((pid, k) => { const p = P(pid); return `<li><span class="n">${k + 1}</span>${av(p)}
    <span class="nm">${esc(p.nome)}<small>${esc(p.partido)}</small></span>
    <button class="sm" title="Subir" onclick="mover('${pid}',-1)">↑</button><button class="sm" title="Descer" onclick="mover('${pid}',1)">↓</button>
    <button class="sm ok" title="Conceder a palavra" onclick="chamar('${pid}')">Chamar</button>
    <button class="sm" title="Retirar inscrição" onclick="desinscrever('${pid}')">✕</button></li>`; }).join('');
  renderStage(); renderParls(); renderHist(); renderTimers();
}

function renderStage() {
  const o = S.orador, i = S.interr;
  if (!o) {
    $('stage').innerHTML = `<p class="mut" style="font-size:18px;margin:24px 0">Nenhum orador na tribuna.</p>
      <button class="pri" onclick="proximo()" ${fila().length ? '' : 'disabled'}>Chamar próximo inscrito (N)</button>`;
    return;
  }
  const p = P(o.pid);
  const outros = S.parls.filter(x => x.id !== o.pid);
  $('stage').innerHTML = `
    <div class="mut" style="margin-bottom:10px">${esc(F(o.fase).nome)} · tempo regimental ${F(o.fase).min} min${o.extra ? ` (+${Math.round(o.extra / 60 * 10) / 10} min concedidos)` : ''}</div>
    <div class="who">${av(p)}<div class="nm">${esc(p.nome)}<small>${esc(p.partido)}</small></div></div>
    <div id="sChip">${statusChip(o)}</div>
    <div class="bigtime tnum" id="sTime"></div>
    <div class="bar" id="sBar"><i></i></div>
    <div class="ctrls">
      <button class="${o.start ? '' : 'ok'}" onclick="alternar()" ${i?.pausouOrador ? 'disabled' : ''}>${o.start ? '⏸ Pausar' : (o.inicio ? '▶ Retomar' : '▶ Iniciar')} (espaço)</button>
      <button onclick="addTempo(60)">+1 min</button><button onclick="addTempo(30)">+30 s</button><button onclick="addTempo(-30)">−30 s</button>
      <button class="bad" onclick="encerrar()">■ Encerrar (E)</button>
      <button class="pri" onclick="proximo()">Próximo ⏭ (N)</button>
    </div>
    ${i ? `<div class="interr"><span class="chip"><span class="dot" style="background:var(--blue)"></span>${TIPOS[i.tipo]}</span>
        <b>${esc(P(i.pid).nome)}</b><span class="t tnum" id="iTime"></span>
        <button class="sm" onclick="encerrarInterr()">Encerrar ${TIPOS[i.tipo].toLowerCase()}</button></div>`
      : `<div class="ctrls" style="margin-top:16px">
        <select id="selInt"><option value="">Parlamentar solicitante…</option>${outros.map(x => `<option value="${x.id}">${esc(x.nome)} (${esc(x.partido)})</option>`).join('')}</select>
        <button onclick="pedir('aparte')" ${o.start ? '' : 'disabled'} title="Orador precisa estar com a palavra">Conceder aparte</button>
        <button onclick="pedir('ordem')">Questão de ordem</button>
        <button onclick="pedir('pelaordem')">Pela ordem</button></div>`}
    <div class="kbd"><b>Espaço</b> iniciar/pausar · <b>N</b> próximo · <b>E</b> encerrar · <b>+</b> 1 minuto</div>`;
}
function pedir(tipo) {
  const pid = $('selInt').value;
  if (!pid) { $('selInt').focus(); $('selInt').style.borderColor = 'var(--bad)'; return; }
  interromper(tipo, pid);
}

function renderParls() {
  const q = ($('busca')?.value || '').toLowerCase(), f = fila();
  $('parls').innerHTML = S.parls.filter(p => (p.nome + ' ' + p.partido).toLowerCase().includes(q)).map(p => {
    const inscrito = f.includes(p.id), naTribuna = S.orador?.pid === p.id;
    return `<div class="p">${av(p)}<span class="nm">${esc(p.nome)}<br><small>${esc(p.partido)}</small></span><span class="act">
      ${naTribuna ? '<span class="chip live"><span class="dot"></span>tribuna</span>'
        : inscrito ? `<button class="sm" onclick="desinscrever('${p.id}')">Inscrito ✓</button>`
        : `<button class="sm" onclick="inscrever('${p.id}')">+ Inscrever</button>`}
      ${naTribuna ? '' : `<button class="sm" title="Conceder a palavra agora, fora da ordem" onclick="chamar('${p.id}')">🎤</button>`}</span></div>`;
  }).join('');
}

function renderHist() {
  $('hist').innerHTML = S.hist.length ? S.hist.map(h => `<div><span><b>${esc(h.nome)}</b> <span class="mut">· ${esc(h.fase)} · ${hhmm(h.inicio)}</span>
    ${h.apartes.length ? `<br><small class="mut">${h.apartes.map(a => `${TIPOS[a.tipo]}: ${esc(a.nome)} (${fmt(a.usado * 1000)})`).join(' · ')}</small>` : ''}</span>
    <span class="tnum ${h.usado > h.previsto + h.extra ? 'st-bad' : ''}">${fmt(h.usado * 1000)} / ${fmt((h.previsto + h.extra) * 1000)}</span></div>`).join('')
    : '<span class="mut">Nenhum pronunciamento registrado.</span>';
}

function paintTimer(o, elT, elBar) {
  const r = remaining(o), lv = level(o);
  elT.textContent = fmt(r);
  elT.className = elT.className.replace(/\bst-\w+|\bblink/g, '').trim() + ' st-' + lv + (lv === 'bad' ? ' blink' : '');
  if (elBar) { elBar.className = 'bar ' + (lv === 'ok' ? '' : lv); elBar.firstElementChild.style.width = Math.max(0, Math.min(100, r / o.total * 100)) + '%'; }
}

function renderTimers() {
  const now = new Date().toLocaleTimeString('pt-BR');
  if (IS_TELAO) {
    $('tClock').textContent = now;
    if (S.orador && $('tTime')) paintTimer(S.orador, $('tTime'), $('tBar'));
    if (S.interr && $('tiTime')) paintTimer(S.interr, $('tiTime'));
    return;
  }
  $('clockA').textContent = now;
  if (S.orador && $('sTime')) paintTimer(S.orador, $('sTime'), $('sBar'));
  if (S.interr && $('iTime')) paintTimer(S.interr, $('iTime'));
}

function renderTelao() {
  $('tCasa').textContent = S.casa; $('tSess').textContent = S.titulo;
  const o = S.orador;
  $('tFase').textContent = F(o ? o.fase : S.faseAtual).nome;
  if (!o) {
    $('tMain').innerHTML = `<div class="idle">Aguardando orador</div>`;
  } else {
    const p = P(o.pid);
    $('tMain').innerHTML = `${av(p).replace('class="av"', 'class="av tav"')}
      <div class="tnome">${esc(p.nome)}</div><div class="tpart">${esc(p.partido)}</div>
      <div class="ttime tnum" id="tTime"></div><div class="bar" id="tBar"><i></i></div>
      <div class="tstat">${statusChip(o)}</div>`;
  }
  const i = S.interr;
  $('tInterr').classList.toggle('hidden', !i);
  if (i) $('tInterr').innerHTML = `<div class="lbl">${TIPOS[i.tipo]}</div><div class="nm">${esc(P(i.pid).nome)}</div>
      <div class="mut" style="font-size:2.2vh">${esc(P(i.pid).partido)}</div><div class="t tnum" id="tiTime"></div>`;
  const nx = (S.filas[o ? o.fase : S.faseAtual] || []).slice(0, 5);
  $('tNext').innerHTML = `<span class="lbl">Próximos inscritos</span>` +
    (nx.length ? nx.map((pid, k) => { const p = P(pid); return `<span class="it"><span class="mut">${k + 1}.</span>${av(p)}${esc(p.nome)} <span class="mut">(${esc(p.partido)})</span></span>`; }).join('')
      : '<span class="mut">—</span>');
  renderTimers();
}

/* ================= Configurações ================= */
function abrirConfig() {
  $('cCasa').value = S.casa; $('cTit').value = S.titulo;
  $('cAlerta').value = S.cfg.alerta; $('cAparte').value = S.cfg.aparte; $('cOrdem').value = S.cfg.ordem;
  $('cDesconta').checked = S.cfg.desconta; $('cCorte').checked = S.cfg.corte; $('cSom').checked = S.cfg.som;
  drawFasesCfg(); drawParlsCfg(); dlg.showModal();
}
let tmpFases;
function drawFasesCfg(keep) {
  if (!keep) tmpFases = S.fases.map(f => ({ ...f }));
  $('cFases').innerHTML = tmpFases.map((f, k) => `<tr><td><input value="${esc(f.nome)}" oninput="tmpFases[${k}].nome=this.value" style="width:100%"></td>
    <td style="width:90px"><input type="number" min="0.5" step="0.5" value="${f.min}" oninput="tmpFases[${k}].min=+this.value" style="width:80px"></td>
    <td style="width:40px"><button class="sm" onclick="tmpFases.splice(${k},1);drawFasesCfg(true)">✕</button></td></tr>`).join('');
}
function addFaseCfg() { tmpFases.push({ id: uid(), nome: 'Nova fase', min: 5 }); drawFasesCfg(true); }
function drawParlsCfg() {
  $('cParls').innerHTML = S.parls.map(p => `<tr><td>${esc(p.nome)}</td><td class="mut">${esc(p.partido)}</td>
    <td style="width:40px"><button class="sm" onclick="remParl('${p.id}')">✕</button></td></tr>`).join('');
}
function addParl() {
  const nome = $('nNome').value.trim(); if (!nome) return;
  S.parls.push({ id: uid(), nome, partido: $('nPart').value.trim().toUpperCase() });
  $('nNome').value = $('nPart').value = ''; commit(); drawParlsCfg();
}
function remParl(id) {
  if (S.orador?.pid === id) return alert('Este parlamentar está na tribuna.');
  S.parls = S.parls.filter(p => p.id !== id);
  for (const k in S.filas) S.filas[k] = S.filas[k].filter(x => x !== id);
  commit(); drawParlsCfg();
}
function salvarConfig() {
  if (!tmpFases.length) return alert('Mantenha ao menos uma fase.');
  S.casa = $('cCasa').value; S.titulo = $('cTit').value;
  S.cfg = { alerta: +$('cAlerta').value, aparte: +$('cAparte').value, ordem: +$('cOrdem').value,
    desconta: $('cDesconta').checked, corte: $('cCorte').checked, som: $('cSom').checked };
  S.fases = tmpFases.filter(f => f.nome.trim() && f.min > 0);
  if (!S.fases.find(f => f.id === S.faseAtual)) S.faseAtual = S.fases[0].id;
  dlg.close(); commit();
}
function resetTudo() {
  if (!confirm('Zerar filas, orador e histórico desta sessão?')) return;
  Object.assign(S, { filas: {}, orador: null, interr: null, hist: [] }); dlg.close(); commit();
}

/* ================= Ata ================= */
function exportarAta() {
  const linhas = [['Parlamentar', 'Partido', 'Fase', 'Início', 'Fim', 'Tempo regimental (s)', 'Tempo concedido extra (s)', 'Tempo usado (s)', 'Apartes / questões']];
  for (const h of [...S.hist].reverse()) linhas.push([h.nome, h.partido, h.fase, new Date(h.inicio).toLocaleString('pt-BR'), new Date(h.fim).toLocaleString('pt-BR'),
    h.previsto, h.extra, h.usado, h.apartes.map(a => `${TIPOS[a.tipo]}: ${a.nome} (${a.usado}s)`).join('; ')]);
  const csv = '﻿' + linhas.map(l => l.map(c => `"${String(c).replace(/"/g, '""')}"`).join(';')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = `ata-tempo-de-fala-${new Date().toISOString().slice(0, 10)}.csv`; a.click();
}
function abrirTelao() { window.open(location.href.split('#')[0] + '#telao', 'telao', 'width=1280,height=720'); }

/* ================= Boot ================= */
$(IS_TELAO ? 'telao' : 'admin').classList.remove('hidden');
document.title = IS_TELAO ? 'Telão — Plenário' : 'Painel do Presidente — Plenário';
if (!IS_TELAO) {
  addEventListener('keydown', e => {
    if (e.target.matches('input,select,textarea') || dlg.open) return;
    if (e.code === 'Space') { e.preventDefault(); alternar(); }
    else if (e.key === 'n' || e.key === 'N') proximo();
    else if (e.key === 'e' || e.key === 'E') encerrar();
    else if (e.key === '+') addTempo(60);
  });
  setInterval(tickAdmin, 250);
} else {
  addEventListener('dblclick', () => document.documentElement.requestFullscreen?.());
}
setInterval(renderTimers, 200);
render();
</script>
</body>
</html>
