# Parlatório Legis em Docker, sempre ligado (reinicia sozinho, como o AzuraCast).
#   docker compose up -d --build
# Configuração da máquina (fica fora do Git) em dados/parlatorio.env, por exemplo:
#   PARLATORIO_BANCO=/dados/tuntum.db
#   PIN_PRESIDENTE=...
#   JITSI_URL=... / JITSI_SEGREDO=...   (deploy/local/jitsi.sh)
# Variáveis desta pasta (.env ou ambiente): PORTA, PORTA_HTTPS, TRANSCRICAO=1, HF_CACHE (modelos já baixados)
# IA local (rascunho da ata, perguntas sobre os discursos, assistente do cidadão): COMPOSE_PROFILES=ia
#   e, em dados/parlatorio.env: IA=ollama, OLLAMA_URL=http://ollama:11434, IA_MODELO=qwen2.5:3b
#   Baixar o modelo uma vez: docker compose exec ollama ollama pull qwen2.5:3b
services:
  parlatorio:
    build:
      context: .
      args:
        TRANSCRICAO: ${TRANSCRICAO:-0}
    user: "${UID_GID:-1000:1000}"
    ports: ["${PORTA:-8090}:8090", "${PORTA_HTTPS:-8443}:8443"]
    env_file:
      - path: dados/parlatorio.env
        required: false
    environment:
      TZ: America/Sao_Paulo
      TLS_NOMES: ${TLS_NOMES:-}
    volumes:
      - ./dados:/dados
      - ${HF_CACHE:-./dados/hf}:/cache/hf
    restart: unless-stopped

  ollama:
    image: ${OLLAMA_IMAGEM:-ollama/ollama:0.5.7}   # versão fixa; para atualizar, troque aqui ou defina OLLAMA_IMAGEM
    profiles: ["ia"]
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 30m
    volumes:
      - ./dados/ollama:/root/.ollama
