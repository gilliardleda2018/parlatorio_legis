name: Versão

# A cada atualização do código na main: testes, versão nova publicada (pacote geral) e os pacotes de todas
# as Câmaras regenerados (releases camara-*). Mudanças só de documentação não geram versão; para pular uma
# versão, ponha [sem versão] na mensagem do commit.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  workflow_dispatch:

concurrency:
  group: pacotes
  cancel-in-progress: false

jobs:
  versao:
    permissions:
      contents: write   # só este job publica releases
    if: ${{ !contains(github.event.head_commit.message, '[sem versão]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ferramentas dos testes completos
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg poppler-utils >/dev/null
      - name: Testes e versão geral
        env:
          GH_TOKEN: ${{ github.token }}
          CI: "true"
        run: |
          TITULO=$(git log -1 --format=%s)
          bash packaging/publicar-versao.sh "$TITULO"
      - name: Pacotes das Câmaras
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for TAG in $(gh release list --limit 200 --json tagName -q '.[].tagName' | grep '^camara-' || true); do
            D=$(mktemp -d)
            gh release download "$TAG" -p camara.json -D "$D"
            gh release download "$TAG" -p brasao -D "$D" 2>/dev/null || true
            python3 packaging/camara-vars.py "$D/camara.json" > "$D/vars.sh"
            . "$D/vars.sh"
            ARGS=(--nome "$NOME")
            [ -n "$CAM" ] && ARGS+=(--camara "$CAM")
            [ -n "$YT" ] && ARGS+=(--youtube-link "$YT")
            [ -f "$D/brasao" ] && ARGS+=(--brasao "$D/brasao")
            echo "== $TAG"
            bash packaging/publicar-camara.sh "$UF" "$MUN" "${ARGS[@]}" || echo "::warning::Falhou ao regenerar $TAG"
          done
