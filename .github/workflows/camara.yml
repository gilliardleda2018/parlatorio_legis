name: Pacote de uma Câmara
run-name: "Pacote de ${{ inputs.camara || inputs.municipio }} (${{ inputs.uf }})"

# Formulário em Actions → "Pacote de uma Câmara" → Run workflow. Gera o pacote da Câmara (município,
# Câmara, brasão e vereadores eleitos do TSE com foto) e publica na release camara-<nome>, com um comando
# de instalação que nunca muda. A cada versão nova do LEGIS, o fluxo "Versão" regenera todas as Câmaras.
on:
  workflow_dispatch:
    inputs:
      uf:
        description: "Estado"
        required: true
        type: choice
        options: [AC, AL, AP, AM, BA, CE, DF, ES, GO, MA, MT, MS, MG, PA, PB, PR, PE, PI, RJ, RN, RS, RO, RR, SC, SP, SE, TO]
        default: MA
      municipio:
        description: "Município (como no TSE, ex.: Barra do Corda)"
        required: true
        type: string
      camara:
        description: "Nome da Câmara (em branco: Câmara Municipal de <município>)"
        required: false
        type: string
      nome:
        description: "Nome curto do endereço (em branco: o do município)"
        required: false
        type: string
      brasao_url:
        description: "Endereço (https://…) da imagem do brasão, PNG, JPEG ou WebP (opcional)"
        required: false
        type: string
      youtube_link:
        description: "Link público da live no YouTube (opcional)"
        required: false
        type: string
      modelo:
        description: "Ou: caminho de um modelo do repositório (ex.: cidades/arame/camara.json). Se preenchido, vale o modelo"
        required: false
        type: string
      modelo_json:
        description: "Ou: o modelo completo em JSON (usado pelo Controle Aggilli; o brasão vem do endereço acima)"
        required: false
        type: string

concurrency:
  group: pacotes
  cancel-in-progress: false

jobs:
  camara:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # só este job publica releases
    steps:
      - uses: actions/checkout@v4
      - name: Gerar e publicar o pacote da Câmara
        env:
          GH_TOKEN: ${{ github.token }}
          UF: ${{ inputs.uf }}
          MUNICIPIO: ${{ inputs.municipio }}
          CAMARA: ${{ inputs.camara }}
          NOME: ${{ inputs.nome }}
          BRASAO_URL: ${{ inputs.brasao_url }}
          YOUTUBE: ${{ inputs.youtube_link }}
          MODELO: ${{ inputs.modelo }}
          MODELO_JSON: ${{ inputs.modelo_json }}
        run: |
          if [ -n "$MODELO_JSON" ]; then   # modelo completo vindo do Controle: conferido aqui de novo, antes de tudo
            D=$(mktemp -d)
            printf '%s' "$MODELO_JSON" > "$D/camara.json"
            if [ -n "$BRASAO_URL" ]; then
              [[ "$BRASAO_URL" =~ ^https:// ]] || { echo "O endereço do brasão deve começar com https://"; exit 1; }
              curl -fsSL --max-filesize 1500000 -o "$D/brasao" "$BRASAO_URL" || { echo "Não consegui baixar o brasão"; exit 1; }
            fi
            python3 - "$D/camara.json" "$D/brasao" <<'PY'
          import json, os, sys
          arq, brasao = sys.argv[1:3]
          m = json.load(open(arq, encoding="utf-8"))
          m["brasao"] = "brasao" if os.path.isfile(brasao) else ""
          json.dump(m, open(arq, "w", encoding="utf-8"), ensure_ascii=False)
          PY
            python3 packaging/modelo.py validar "$D/camara.json"
            exec bash packaging/publicar-camara.sh --modelo "$D/camara.json"
          fi
          if [ -n "$MODELO" ]; then
            [[ "$MODELO" =~ ^cidades/[a-z0-9-]+/camara\.json$ ]] || { echo "Modelo deve ser cidades/<nome>/camara.json"; exit 1; }
            exec bash packaging/publicar-camara.sh --modelo "$MODELO"
          fi
          ARGS=()
          [ -n "$CAMARA" ] && ARGS+=(--camara "$CAMARA")
          [ -n "$NOME" ] && ARGS+=(--nome "$NOME")
          [ -n "$BRASAO_URL" ] && ARGS+=(--brasao-url "$BRASAO_URL")
          [ -n "$YOUTUBE" ] && ARGS+=(--youtube-link "$YOUTUBE")
          bash packaging/publicar-camara.sh "$UF" "$MUNICIPIO" "${ARGS[@]}"
